name: CI - Lint, Test & Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-lint:
    name: Lint, Unit Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter Checks (Oxlint)
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
